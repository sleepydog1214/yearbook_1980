<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clarion — Divine Child High School Yearbooks</title>
<style>
  :root {
    --bg: #14100e; --panel: #201a17; --ink: #efe7dc;
    --dim: #a89a8c; --accent: #d33a2f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    text-align: center; padding: 2.5rem 1rem 1rem;
    border-bottom: 3px solid var(--accent); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: 0.08em; }
  header h1 span { color: var(--accent); }
  header p { color: var(--dim); margin: 0.5rem 0 1.2rem; }
  main {
    flex: 1; display: flex; flex-wrap: wrap; gap: 2rem;
    align-items: flex-start; justify-content: center; padding: 3rem 1.5rem;
  }
  .book {
    display: block; width: 260px; text-decoration: none; color: var(--ink);
    background: var(--panel); border-radius: 8px; overflow: hidden;
    border: 1px solid #000; transition: transform 0.15s;
  }
  .book:hover { transform: translateY(-6px); outline: 2px solid var(--accent); }
  .book img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; background: #0d0b09; }
  .book .label { padding: 0.8rem; text-align: center; }
  .book .label b { font-size: 1.2rem; letter-spacing: 0.05em; }
  .book .label div { color: var(--dim); font-size: 0.85rem; margin-top: 0.2rem; }
  footer { text-align: center; color: var(--dim); font-size: 0.8rem; padding: 1rem; }
</style>
</head>
<body>
<header>
  <h1>THE <span>CLARION</span></h1>
  <p>Divine Child High School &middot; Dearborn, Michigan</p>
</header>
<main>
  <a class="book" href="1980/">
    <img src="1980/pages/p001.jpg" alt="Clarion 1980 cover">
    <div class="label"><b>1980</b><div>Browse the book, photos &amp; search</div></div>
  </a>
  <a class="book" href="1981/">
    <img src="1981/pages/p001.jpg" alt="Clarion 1981 cover">
    <div class="label"><b>1981</b><div>Browse the book, photos &amp; search</div></div>
  </a>
  <a class="book" href="1981-seniors/">
    <img src="1981-seniors/color/p134_2.jpg" alt="Clarion 1981 Seniors morph gallery">
    <div class="label"><b>1981 Seniors</b><div>B&amp;W &rarr; color morph gallery</div></div>
  </a>
</main>
<footer>Scanned, restored, and colorized from the original yearbooks.</footer>
</body>
</html>
