<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarion 1980 — Divine Child High School</title>
<style>
  :root {
    --bg: #14100e;
    --panel: #201a17;
    --ink: #efe7dc;
    --dim: #a89a8c;
    --accent: #d33a2f;
    --accent-soft: #7c2a24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }
  header {
    display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap;
    padding: 0.9rem 1.2rem; background: var(--panel);
    border-bottom: 3px solid var(--accent);
    position: sticky; top: 0; z-index: 20;
  }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: 0.06em; }
  header h1 .year { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 0.85rem; }
  nav { margin-left: auto; display: flex; gap: 0.4rem; align-items: center; }
  nav button {
    background: none; border: 1px solid var(--dim); color: var(--ink);
    font: inherit; font-size: 0.9rem; padding: 0.3rem 0.9rem;
    border-radius: 2rem; cursor: pointer;
  }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .books { display: flex; gap: 0.15rem; margin-right: 0.5rem; }
  .books a {
    color: var(--dim); text-decoration: none; font-size: 0.9rem;
    padding: 0.3rem 0.55rem; border-radius: 4px;
  }
  .books a:hover { color: var(--ink); }
  .books a.here { color: var(--accent); font-weight: bold; }
  #search {
    background: var(--bg); color: var(--ink); border: 1px solid var(--dim);
    border-radius: 2rem; padding: 0.32rem 0.9rem; font: inherit;
    font-size: 0.9rem; width: 15rem; max-width: 40vw;
  }

  /* ---------- book view ---------- */
  #book { display: none; padding: 1rem; }
  #book.active { display: block; }
  .spread {
    display: flex; justify-content: center; gap: 6px;
    max-width: 1300px; margin: 0 auto;
  }
  .page-wrap { position: relative; flex: 0 1 auto; min-width: 0; }
  .page-wrap img {
    display: block; max-height: 78vh; max-width: 100%;
    box-shadow: 0 6px 30px rgba(0,0,0,0.6);
  }
  .hotspot {
    position: absolute; border: 2px solid transparent; cursor: pointer;
  }
  .hotspot:hover { border-color: var(--accent); background: rgba(211,58,47,0.12); }
  .book-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 1rem; margin-top: 0.9rem;
  }
  .book-controls button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--dim);
    font: inherit; padding: 0.35rem 1.1rem; border-radius: 2rem; cursor: pointer;
  }
  .book-controls button:hover { border-color: var(--accent); }
  #spread-label { color: var(--dim); min-width: 9rem; text-align: center; }
  #spread-slider { width: min(420px, 50vw); accent-color: var(--accent); }

  /* ---------- gallery view ---------- */
  #gallery { display: none; padding: 1.2rem; }
  #gallery.active { display: block; }
  #match-count { color: var(--dim); margin: 0 0 0.8rem; font-size: 0.9rem; }
  .grid {
    columns: 5 240px; column-gap: 12px; max-width: 1500px; margin: 0 auto;
  }
  .card {
    break-inside: avoid; margin: 0 0 12px; background: var(--panel);
    border-radius: 6px; overflow: hidden; cursor: pointer;
    border: 1px solid #000;
  }
  .card img { width: 100%; display: block; }
  .card:hover { outline: 2px solid var(--accent); }
  .card .meta { padding: 0.45rem 0.6rem; font-size: 0.78rem; color: var(--dim); }
  .card .meta .cap {
    color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---------- lightbox ---------- */
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(8,5,4,0.93); padding: 2vh 2vw;
    flex-direction: column; align-items: center;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 96vw; max-height: 82vh; box-shadow: 0 8px 40px #000;
  }
  #lb-caption {
    max-width: 70ch; text-align: center; margin: 0.9rem 0 0.4rem;
    font-style: italic; color: var(--ink);
  }
  #lb-meta { color: var(--dim); font-size: 0.85rem; }
  #lb-meta a { color: var(--accent); cursor: pointer; }
  #lb-close {
    position: absolute; top: 1rem; right: 1.4rem; font-size: 2rem;
    color: var(--dim); cursor: pointer; background: none; border: none;
  }
  #lb-close:hover { color: var(--ink); }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 2.2rem; color: var(--dim); background: none; border: none;
    cursor: pointer; padding: 1rem;
  }
  .lb-nav:hover { color: var(--ink); }
  #lb-prev { left: 0.4rem; } #lb-next { right: 0.4rem; }

  #loading { text-align: center; color: var(--dim); padding: 4rem 1rem; }
  @media (max-width: 700px) {
    .spread { flex-direction: row; }
    .page-wrap img { max-height: 60vh; }
    #search { width: 100%; max-width: none; }
  }
</style>
</head>
<body>
<header>
  <h1>CLARION <span class="year">1980</span></h1>
  <span class="sub">Divine Child High School &middot; Dearborn, Michigan</span>
  <nav>
    <span class="books" title="Other years">
      <a href="../1980/" class="here">1980</a>
      <a href="../1981/">1981</a>
    </span>
    <button id="tab-book" onclick="showView('book')">Book</button>
    <button id="tab-gallery" onclick="showView('gallery')">Photos</button>
    <input id="search" type="search" placeholder="Search captions &amp; pages&hellip;">
  </nav>
</header>

<div id="loading">Opening the yearbook&hellip;</div>

<main id="book">
  <div class="spread" id="spread"></div>
  <div class="book-controls">
    <button onclick="turnPage(-1)">&#8678; Back</button>
    <span id="spread-label"></span>
    <button onclick="turnPage(1)">Forward &#8680;</button>
  </div>
  <div class="book-controls">
    <input id="spread-slider" type="range" min="0" value="0"
           oninput="gotoSpread(+this.value)">
  </div>
</main>

<main id="gallery">
  <p id="match-count"></p>
  <div class="grid" id="grid"></div>
</main>

<div id="lightbox">
  <button id="lb-close" onclick="closeLightbox()">&times;</button>
  <button class="lb-nav" id="lb-prev" onclick="lightboxStep(-1)">&#10094;</button>
  <img id="lb-img" alt="">
  <p id="lb-caption"></p>
  <p id="lb-meta"></p>
  <button class="lb-nav" id="lb-next" onclick="lightboxStep(1)">&#10095;</button>
</div>

<script>
let cat = null;            // catalog.json
let pageByNo = {};         // page number -> page entry
let curSpread = 0;
let shownPhotos = [];      // gallery order after filtering
let lbIndex = -1;

async function boot() {
  cat = await (await fetch('catalog.json')).json();
  for (const p of cat.pages) pageByNo[p.page] = p;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('spread-slider').max = cat.spreads.length - 1;
  document.getElementById('search').addEventListener('input', refreshGallery);
  document.addEventListener('keydown', onKey);
  applyHash();
  window.addEventListener('hashchange', applyHash);
}

function applyHash() {
  const h = location.hash;
  let m;
  if ((m = h.match(/^#page\/(\d+)/))) {
    const idx = cat.spreads.findIndex(s => s.includes(+m[1]));
    showView('book', true);
    gotoSpread(idx >= 0 ? idx : 0);
  } else if ((m = h.match(/^#photo\/(\w+)/))) {
    showView('gallery', true);
    refreshGallery();
    const i = shownPhotos.findIndex(p => p.id === m[1]);
    if (i >= 0) openLightbox(i);
  } else if (h === '#photos') {
    showView('gallery', true); refreshGallery();
  } else {
    showView('book', true); gotoSpread(curSpread);
  }
}

function showView(name, silent) {
  for (const v of ['book', 'gallery']) {
    document.getElementById(v).classList.toggle('active', v === name);
    document.getElementById('tab-' + v).classList.toggle('active', v === name);
  }
  if (!silent) {
    if (name === 'gallery') { location.hash = '#photos'; refreshGallery(); }
    else location.hash = '#page/' + cat.spreads[curSpread][0];
  }
}

/* ---------- book ---------- */
function gotoSpread(idx) {
  curSpread = Math.max(0, Math.min(cat.spreads.length - 1, idx));
  const nums = cat.spreads[curSpread];
  const holder = document.getElementById('spread');
  holder.innerHTML = '';
  for (const no of nums) {
    const pg = pageByNo[no];
    const wrap = document.createElement('div');
    wrap.className = 'page-wrap';
    const img = document.createElement('img');
    img.src = pg.file;
    img.alt = 'Page ' + no;
    wrap.appendChild(img);
    for (const ph of cat.photos.filter(p => p.page === no)) {
      const hs = document.createElement('div');
      hs.className = 'hotspot';
      const [x0, y0, x1, y1] = ph.bbox_rel;
      hs.style.left = (x0 * 100) + '%';
      hs.style.top = (y0 * 100) + '%';
      hs.style.width = ((x1 - x0) * 100) + '%';
      hs.style.height = ((y1 - y0) * 100) + '%';
      hs.title = ph.caption || 'View photo';
      hs.onclick = () => { shownPhotos = cat.photos; openLightbox(cat.photos.indexOf(ph)); };
      wrap.appendChild(hs);
    }
    holder.appendChild(wrap);
  }
  document.getElementById('spread-label').textContent =
    nums.length === 2 ? `Pages ${nums[0]}–${nums[1]}` : `Page ${nums[0]}`;
  document.getElementById('spread-slider').value = curSpread;
  history.replaceState(null, '', '#page/' + nums[0]);
}

function turnPage(dir) { gotoSpread(curSpread + dir); }

/* ---------- gallery ---------- */
function refreshGallery() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const pageHit = {};
  if (q) {
    for (const pg of cat.pages)
      pageHit[pg.page] = (pg.text || '').toLowerCase().includes(q);
  }
  shownPhotos = cat.photos.filter(p =>
    !q || (p.caption || '').toLowerCase().includes(q) || pageHit[p.page]);
  document.getElementById('match-count').textContent =
    q ? `${shownPhotos.length} photos match “${q}”`
      : `${cat.photos.length} photos from the 1980 Clarion`;
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  shownPhotos.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = p.thumb;
    img.alt = p.caption || ('Photo from page ' + p.page);
    card.appendChild(img);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = (p.caption ? `<div class="cap"></div>` : '') +
                     `<div>Page ${p.page}</div>`;
    if (p.caption) meta.querySelector('.cap').textContent = p.caption;
    card.appendChild(meta);
    card.onclick = () => openLightbox(i);
    grid.appendChild(card);
  });
}

/* ---------- lightbox ---------- */
function openLightbox(i) {
  lbIndex = i;
  const p = shownPhotos[i];
  if (!p) return;
  document.getElementById('lb-img').src = p.file;
  document.getElementById('lb-caption').textContent = p.caption || '';
  const meta = document.getElementById('lb-meta');
  meta.innerHTML = '';
  const link = document.createElement('a');
  link.textContent = 'Page ' + p.page;
  link.onclick = () => { closeLightbox(); location.hash = '#page/' + p.page; };
  meta.append('From ', link, ` · ${p.id}`);
  document.getElementById('lightbox').classList.add('open');
  history.replaceState(null, '', '#photo/' + p.id);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  lbIndex = -1;
}

function lightboxStep(dir) {
  if (lbIndex < 0) return;
  openLightbox((lbIndex + dir + shownPhotos.length) % shownPhotos.length);
}

function onKey(e) {
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lightboxStep(-1);
    if (e.key === 'ArrowRight') lightboxStep(1);
  } else if (document.getElementById('book').classList.contains('active')
             && document.activeElement.id !== 'search') {
    if (e.key === 'ArrowLeft') turnPage(-1);
    if (e.key === 'ArrowRight') turnPage(1);
  }
}

boot();
</script>
</body>
</html>
